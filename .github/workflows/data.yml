# 每个交易日收盘后更新 A 股数据，并发布静态网站到 GitHub Pages。
#
# 数据状态（完整的 daily.parquet 等）存在固定的 Release「data-latest」里，不进 git：
# 每次先下载上次的数据 → 增量更新（只补当天）或全量下载 → 上传回 Release → 导出网页数据 → 部署 Pages。
# 全量下载时分 6 组并行（在美国的服务器上东方财富日线又快又稳，所以优先用东财）。
name: data

on:
  schedule:
    - cron: "0 8 * * 1-5"   # 北京时间工作日 16:00（收盘后）
  push:   # 开发分支上改了数据流水线时跑一次（只更新数据，不部署网站）
    branches: [claude/project-thread-3o62qb]
    paths: [".github/workflows/data.yml", "app/sync.py", "scripts/export_site_data.py"]
  workflow_dispatch:
    inputs:
      full:
        description: "全部重新下载（3 年日线）"
        type: boolean
        default: false

permissions:
  contents: write   # 读写 Release 里的数据
  pages: write
  id-token: write

concurrency:
  group: data
  cancel-in-progress: false

env:
  XG_PREFER_EM: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 下载上次的数据
        run: |
          mkdir -p data/cn_a
          gh release download data-latest -D data/cn_a --pattern '*' --clobber || echo "还没有数据 Release，将全量下载"
          ls -la data/cn_a
      - id: mode
        name: 决定增量还是全量
        run: |
          if [ "${{ inputs.full }}" = "true" ] || [ ! -f data/cn_a/daily.parquet ]; then echo "mode=full" >> "$GITHUB_OUTPUT"; else echo "mode=incremental" >> "$GITHUB_OUTPUT"; fi
      - name: 增量更新（只补最新交易日）
        if: steps.mode.outputs.mode == 'incremental'
        run: python -u -m app.sync --incremental --workers 6 --no-industry 2>&1 | tr '\r' '\n' | grep -v -E '^\s*$|it/s|s/it'
      - name: 全量：先取股票列表（行业分类在另一个并行任务里）
        if: steps.mode.outputs.mode == 'full'
        run: python -u -m app.sync --list-only --no-industry 2>&1 | tr '\r' '\n' | grep -v -E '^\s*$|it/s|s/it'
      - uses: actions/upload-artifact@v4
        with:
          name: state
          path: |
            data/cn_a/*.parquet
            data/cn_a/*.json
          retention-days: 3

  # 行业分类：单独并行跑、限时；失败也不影响整条流水线（沿用上次的或留空）
  industry:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    env:
      XG_SW_BUDGET: "420"   # 申万最多 7 分钟（进度会保存，下次接着补），剩下的时间留给新浪退路
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: state, path: data/cn_a }
      - name: 行业分类（申万优先，7 天内有缓存就不重新下载）
        run: |
          touch data/cn_a/spot_cache.parquet
          # 只有申万结果 7 天内更新过才跳过；用的还是退路（新浪 / 东财）时，每天继续补申万
          if python -c "import pandas as pd,datetime as dt,sys;i=pd.read_parquet('data/cn_a/industry.parquet');sys.exit(0 if str(i['source'].iloc[0]).startswith('申万') and (dt.datetime.now()-pd.to_datetime(i['fetched_at'].iloc[0])).days<7 else 1)" 2>/dev/null; then
            echo "申万行业分类 7 天内更新过，沿用"
          else
            timeout 780 python -u -m app.sync --industry-only 2>&1 | tr '\r' '\n' | grep -v -E '^\s*$|it/s|s/it' | tail -15 || echo "行业分类超时或失败，沿用上次的"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: industry
          path: |
            data/cn_a/industry.parquet
            data/cn_a/industry_sw_partial.json
            data/cn_a/sw_levels.json
          if-no-files-found: ignore
          retention-days: 3

  download:
    needs: prepare
    if: needs.prepare.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: state, path: data/cn_a }
      - name: 下载第 ${{ matrix.part }} 组
        run: |
          touch data/cn_a/spot_cache.parquet   # 用 prepare 取好的同一份股票列表
          python -u -m app.sync --full --chunk ${{ matrix.part }}/6 --years 3 --workers 6 --no-industry 2>&1 | tr '\r' '\n' | grep -v -E '^\s*$|it/s|s/it' | tail -20
      - uses: actions/upload-artifact@v4
        with:
          name: hist-${{ matrix.part }}
          path: |
            data/cn_a/hist
            data/cn_a/failed_*.json
          retention-days: 1

  merge:
    needs: [prepare, download]
    if: needs.prepare.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: state, path: data/cn_a }
      - uses: actions/download-artifact@v4
        with: { pattern: "hist-*", path: data/cn_a, merge-multiple: true }
      - name: 合并
        run: |
          touch data/cn_a/spot_cache.parquet
          ls data/cn_a/hist | wc -l
          python -u -m app.sync --merge-only --years 3 --no-industry 2>&1 | tr '\r' '\n' | grep -v -E '^\s*$|it/s|s/it' | tail -10
      - uses: actions/upload-artifact@v4
        with:
          name: state-merged
          path: |
            data/cn_a/*.parquet
            data/cn_a/*.json
          retention-days: 3

  publish:
    needs: [prepare, merge, industry]
    if: always() && needs.prepare.result == 'success' && (needs.merge.result == 'success' || needs.merge.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with: { name: "${{ needs.prepare.outputs.mode == 'full' && 'state-merged' || 'state' }}", path: data/cn_a }
      - uses: actions/download-artifact@v4
        continue-on-error: true   # 行业分类失败时没有这个产物
        with: { name: industry, path: data/cn_a }
      - name: 应用行业分类
        run: python -u -m app.sync --apply-industry
      - name: 数据存回 Release「data-latest」
        run: |
          cat data/cn_a/meta.json
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "数据（自动更新）" --notes "StockSieve 的行情数据，由 GitHub Actions 每个交易日自动更新。网页从 GitHub Pages 读取导出后的版本。" --latest=false
          gh release upload data-latest data/cn_a/daily.parquet data/cn_a/stocks.parquet data/cn_a/meta.json $(ls data/cn_a/industry.parquet data/cn_a/spot_cache.parquet data/cn_a/sw_levels.json data/cn_a/industry_sw_partial.json 2>/dev/null) --clobber
      - name: 生成静态网站
        run: |
          python scripts/build_web.py --no-data
          python scripts/export_site_data.py --out site/data
          du -sh site site/data
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: publish
    # GitHub Pages 只允许从默认分支发布。要写 always()：增量更新时全量下载那几步被跳过，
    # 不写的话「跳过」会一路传下来，让发布也被跳过
    if: always() && needs.publish.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
